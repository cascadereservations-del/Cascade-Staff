<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add Guest Details</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Add a guest's phone, email, companions and ID photo from their message or photos.">
<meta name="theme-color" content="#F9F6F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#130E09" media="(prefers-color-scheme: dark)">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Style+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>
  .input select { flex: 1; min-width: 0; border: 0; background: transparent; color: inherit; font: 400 15px/22px var(--font-ui); outline: none; }
  .input select option { background: var(--card); color: var(--fg); }
  .gd-shots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .gd-shot { position: relative; aspect-ratio: 1; border-radius: var(--r-md); overflow: hidden; background: var(--card); border: 1px solid var(--border); }
  .gd-shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .gd-shot button { position: absolute; top: 4px; right: 4px; width: 28px; height: 28px; padding: 0; border-radius: 50%; }
  .gd-id { display: grid; grid-template-columns: 72px 1fr; gap: 12px; align-items: start; }
  .gd-id img { width: 72px; height: 72px; object-fit: cover; border-radius: var(--r-md); }
</style>
<script src="../theme.js"></script>
</head>
<body>
<div class="shell" id="gd" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js" integrity="sha384-iLddHTLokph6Omwoyid4XKxHaWa6w41BnoEj0q5oOrzmYPpHIKt1wyjReA7s//pP" crossorigin="anonymous"></script>
<script src="../icons.js"></script>
<script src="../lib.js"></script>
<script src="guest-lib.js"></script>
<script src="guest.js"></script>
</body>
</html>
