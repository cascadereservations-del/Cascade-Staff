<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cascade Staff</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Cascade Hideaway staff app: guest calendar info, quick guide, payment request. Sign in with your name and PIN.">
<meta name="theme-color" content="#F6F3EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141210" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cascade Staff">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="fonts/cormorant-garamond-600.woff2" as="font" type="font/woff2" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="theme.js"></script>
</head>
<body>
<div class="shell" id="app">

  <!-- Sign in -->
  <section class="view" id="v-signin" aria-labelledby="si-h">
    <div class="screen notab">
      <form class="signin" id="signin-form" autocomplete="on" novalidate>
        <div>
          <h1 class="word" id="si-h"><b>C</b>ascade</h1>
          <div class="cap up" style="margin-top:8px">Staff</div>
          <div class="hair" aria-hidden="true"></div>
          <div class="tag" style="margin-top:10px">Hotel Comfort. Home Warmth.</div>
        </div>
        <div class="field"><label for="si-name">Name or e-mail</label>
          <div class="input"><input id="si-name" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required></div></div>
        <div class="field"><label for="si-pin">PIN or password</label>
          <div class="input"><input id="si-pin" name="password" type="password" autocomplete="current-password" required><span id="si-lock" aria-hidden="true"></span></div></div>
        <div class="errbox" id="si-err" role="alert" hidden></div>
        <button class="btn btn-primary btn-block" id="si-go" type="submit">Sign in</button>
        <p class="help">You stay signed in on this phone. Ask Lloyd for access.</p>
      </form>
    </div>
  </section>

  <!-- Home, Calendar, More: filled by app.js -->
  <section class="view" id="v-home" aria-live="polite"></section>
  <section class="view" id="v-calendar" aria-live="polite"></section>
  <section class="view" id="v-more"></section>

  <nav class="tabbar" id="tabbar" aria-label="Primary" hidden></nav>
</div>

<!-- iOS one-time hint -->
<div class="scrim" id="a2hs-scrim"></div>
<div class="sheet" id="a2hs" role="dialog" aria-modal="true" aria-labelledby="a2hs-h" aria-hidden="true">
  <h2 class="ttl" id="a2hs-h">Add Cascade Staff to your Home Screen</h2>
  <p class="sub" style="margin-top:8px">Tap <b>Share</b> <span id="a2hs-share" style="vertical-align:-4px"></span>, then <b>Add to Home Screen</b>. It opens like an app and keeps you signed in.</p>
  <button class="btn btn-primary btn-block" id="a2hs-ok" type="button" style="margin-top:16px">Got it</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script src="icons.js"></script>
<script src="lib.js"></script>
<script src="app.js"></script>
</body>
</html>
