<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Open your bank app</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#EEF1F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1420" media="(prefers-color-scheme: dark)">
<meta name="referrer" content="no-referrer">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="C_pay.css">
<script src="../theme.js"></script>
</head>
<body>
<!-- SPEC-37 7.B. No data and no account details in the URL: only ?app=<key>. It opens the app; the amount travels inside the QR, never in a link. -->
<main class="shell" style="padding:24px var(--gutter)">
  <div class="stack" id="bank" style="text-align:center;margin-top:48px"></div>
</main>
<script src="pay-lib.js"></script>
<script>
(function () {
  var P = window.CSPay, el = document.getElementById('bank');
  var key = new URLSearchParams(location.search).get('app'), listed = P.listedBankApps();
  function e(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  // Lane C: the how-to is the same for every bank. The exact menu name in the BPI app is unconfirmed, so the words stay generic.
  var HOW = '<p class="sub">Open your bank app yourself, choose the option to pay with a QR code, then pick the saved QR photo from your gallery. The amount is already in the QR.</p>';
  if (listed.indexOf(key) < 0) {
    // BPI first: the table order is the list order. Only apps verified on Lloyd's phone are ever offered.
    el.innerHTML = '<h1 class="dlg">Open your bank app</h1>' + listed.map(function (k) { return '<a class="btn btn-primary btn-block" href="bank.html?app=' + encodeURIComponent(k) + '">Open ' + e(P.BANK_APPS[k].name) + '</a>'; }).join('') + HOW;
    return;
  }
  var a = P.BANK_APPS[key], ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  var href = ios ? (a.ios || a.store) : P.bankIntentUrl(key);
  el.innerHTML = '<h1 class="dlg">Open ' + e(a.name) + '</h1><a class="btn btn-primary btn-block" href="' + e(href) + '">Open ' + e(a.name) + '</a>' +
    HOW;
})();
</script>
</body>
</html>
